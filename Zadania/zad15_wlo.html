<!DOCTYPE html>
<html>
<head>
    <title>Ułamek egipski 4</title>
    <meta charset="utf-8">
</head>

<body>
    <div style="color: rgb(0, 255, 0); font-size: 50px">

        <script>
            var M = prompt("Podaj m:");
            var m = parseFloat(M);

            document.write(
                "1/" + m + " = " +
                "1/" + (m * 2) + " + " +
                "1/" + (m * 2)
            );
        </script>

    </div>
</body>
</html>
