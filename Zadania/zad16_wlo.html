<!DOCTYPE html>
<html>
<head>
    <title>proste obliczenia</title>
    <meta charset="utf-8">
</head>

<body>
    <div style="color: rgb(255, 0, 0); font-size: 50px">

        <script>
            var l1 = prompt("Podaj A:");
            var a = parseFloat(l1);
            var l2 = prompt("Podaj B:");
            var b = parseFloat(l2);
            document.write(
                "(" + a + " + " + b + ")^3 = " +
                a + "^3 + 3*((" + a + ")^2)*(" + b + ") + " +
                "3*(" + a + ")*((" + b + ")^2) + " +
                b + "^3 = " +
                a**3 + " + " +
                3*a**2*b + " + " +
                3*a*b**2 + " + " +
                b**3 + " = " +
                (a+b)**3
            );
            
        </script>

    </div>
</body>
</html>
