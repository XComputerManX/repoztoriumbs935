<html>
<head>
 <meta charset="UTF-8">
 <title>Zadanie 19 - Włodarczyk</title>
</head>
<body>
<script type="text/javascript">
// Jan Włodarczyk 2P 
// Zadanie 19
 function Pole_wlodarczyk()
 {
var a_wlo= parseFloat(document.getElementById('dlugosc').value);
var b_wlo= a_wlo*a_wlo;
 document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_wlo.toFixed(2)+" cm^2";
 }
 function obwod_wlodarczyk()
 {
var a_wlo= parseFloat(document.getElementById('dlugosc').value);
var b_wlo= 4*a_wlo;
 document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_wlo.toFixed(2)+" cm";
 }
 function okno_zamknij_wlodarczyk()
 {
 window.close()
 }
</script>
 <h1>Wszystko o KWADRACIE</h1><br><br>
 Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br>
 <input type="button" name="pole" value="Oblicz pole" Onclick="Pole_wlodarczyk()"><br><br>
 <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_wlodarczyk()"><br><br>
 <div style="color:red;font-size:50px;" id="nazwa"></div>
 <input type="button" value="zamknij okno" onclick="okno_zamknij_wlodarczyk()"/>
</body>
</html>
