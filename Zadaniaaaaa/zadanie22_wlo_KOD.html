 <script language="JavaScript">
// Jan Włodarczyk 2P

function Pole_wlodarczyk(a_wlo,b_wlo)
{
 var a=parseFloat(a_wlo);
 var b=parseFloat(b_wlo);
 var P=a*b;
 document.getElementsByName('pole')[0].value=P.toFixed(2);
 wyprowadz_pole_wlo.innerHTML="P="+P.toFixed(2)+" cm^2";
}
function obwod_wlodarczyk(a_wlo,b_wlo)
{
 var a=parseFloat(a_wlo);
 var b=parseFloat(b_wlo);
 var Ob=2*a+2*b;
 document.getElementsByName('obw')[0].value=Ob.toFixed(2);
 wyprowadz_obwod_wlo.innerHTML="Ob="+Ob.toFixed(2)+" cm";
}
function okno_zamknij_wlodarczyk()
 {
 window.close()
 }
 </script>
</head>
<body>
Obliczanie pola i obwodu prostokąta

<form name="formularz" action="..." onsubmit="Pole_wlodarczyk(this.a_dana_wlo.value,this.b_dana_wlo.value); obwod_wlodarczyk(this.a_dana_wlo.value,this.b_dana_wlo.value);return false">
