<font color="blue" face="Arial" size="5">
<script language="JavaScript">
// Jan Włodarczyk 2P 
// Zadanie 24
 var x1_wlo=parseFloat(prompt("x1=",""));
 var x2_wlo=parseFloat(prompt("x2=",""));
 var n_wlo=3;
 var rad=(x1_wlo*Math.PI)/180;
 var y1=3*Math.pow(x1_wlo,n_wlo/(n_wlo+2));
 var y2=2*Math.cos(rad)+3*Math.sin(rad);
 var y3=Math.cbrt(Math.pow(x1_wlo,5)+2*Math.pow(x2_wlo,4))*Math.abs(x1_wlo-x2_wlo);
 document.write("wczytane liczby: x1="+x1_wlo+"&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;x2="+x2_wlo+"<br>");
 document.write("w stopniach x1="+x1_wlo+" [stopniach]&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;x1="+rad.toFixed(2)+" [radianach]<br>");
 document.write("y1 = "+y1.toFixed(2)+"<br>");
 document.write("y2 = "+y2.toFixed(2)+"<br>");
 document.write("y3 = "+y3.toFixed(2)+"<br>");
 function okno_zamknij_wlodarczyk()
 {
 window.close()
 }
</script>
</font>
<br>
<input type="button" value="zamknij okno" onclick="okno_zamknij_wlodarczyk()"/>
