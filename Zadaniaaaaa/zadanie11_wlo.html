 <div style="color:green;font-size:51px;">
 <script language="JavaScript">
// Jan Włodarczyk 2P 
// Zadanie 11
 var D1_wlo=prompt("D1=","");
 var D2_wlo=prompt("D2=","");
 var sekund;
 var a=parseFloat(D1_wlo);
 var b=parseFloat(D2_wlo);
 sekund=(a-b)*24*60*60;
 document.write("Ilość sekund między dniami "+a+" i "+b+" = "+sekund+" sekund<br>");
 function okno_zamknij_wlodarczyk()
 {
 window.close()
 }
 </script>
 </div>
 <input type="button" value="zamknij okno" onclick="okno_zamknij_wlodarczyk()"/>
 </body>
